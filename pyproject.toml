# JourneyLab Python workspace — STEP-001.01
#
# Python 3.14 is the baseline for optimisation, ML, retrieval and data-intensive
# services (blueprint §10). Locked via uv.lock so resolution is reproducible.

[project]
name = "journeylab"
version = "0.0.0"
description = "JourneyLab — trip digital twin: optimisation, ML, retrieval and data services"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary,pool]>=3.3.4",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.140",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12.20260724",
    "jsonschema>=4.26.0",
    "datamodel-code-generator>=0.72.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
# STEP-004.07: generated clients are excluded for the same reason biome.json
# excludes them. A linter that reformats or rewrites generated output fights the
# generator through the drift guard: format -> guard reports drift -> regenerate ->
# format again, forever. The generator's output is the contract's problem, not the
# style guide's.
extend-exclude = [".gitnexus", "docs", "apps/api/src/generated"]

[tool.ruff.lint]
# Selected for correctness over style. Notable inclusions:
#   DTZ — flags naive datetimes. This product has three time axes
#         (observed / effective / recorded); a naive datetime here becomes an
#         infeasible itinerary in STEP-012. See STEP-006.02.
#   S   — security lint (bandit rules)
#   ASYNC — async correctness, relevant to tenant-context propagation
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "S", "ASYNC", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is expected in tests
    # STEP-005.01: the SSRF suite must NAME the addresses it refuses, and 0.0.0.0
    # in a parametrize list is a blocked range under test, not a bind address.
    "S104",
    # Seeded RNG is how the backoff-jitter bounds are asserted deterministically
    # instead of sampled and hoped for.
    "S311",
    # A shared secret in a webhook-signature test is a fixture, not a credential.
    "S105",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
exclude = ["^\\.gitnexus/", "^docs/"]
# STEP-002.02: src layout. The sub-step file names the path apps/api/src/auth/,
# so the package is `auth` rather than a namespaced one. Kept literal to match the
# documentation; revisit if a second service ever wants the same top-level name.
mypy_path = "apps/api/src:services/identity/src:services/audit/src:services/integrations/src:services/ingestion/src:services/events/src:services/routing/src:tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so the five copies of the database-availability check
# could become one (STEP-001.07, BUG-023). Without it each test module would
# have to reach for a relative import, which is what produced the copies.
pythonpath = ["apps/api/src", "services/identity/src", "services/audit/src", "services/integrations/src", "services/ingestion/src", "services/events/src", "services/routing/src", "tools", "tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config"
markers = [
    "security: tenant isolation and authorization tests (regression check R7)",
    "contract: contract compatibility tests (regression check R2)",
    "property: property-based tests over constraints and temporal logic",
]
