# JourneyLab local development stack — STEP-001.04
#
# PORT ALLOCATION: JourneyLab owns the contiguous block 5700-5709.
# Verified free on 2026-08-05 against every other project on this Docker host.
# Ports claimed elsewhere and deliberately avoided:
#   3000 3001 (real-estate)  3307 5433 6380 8080 (trekyatra)
#   5460 6379 8000 9090 (real-estate)  5544 27017 (saakshya)
# NOTE: 5544 looked free to `lsof` because Saakshya was stopped — a stopped
# project still owns its ports. Always check compose files, not just live sockets.
# Guard: tests/guards/port-collisions.sh
#
# All ports are bound to 127.0.0.1 — nothing is exposed to the network.

name: journeylab

services:
  postgres:
    build:
      context: ./infra/local/postgres
    image: journeylab-postgres:local
    # PostGIS PG18 ships amd64 only; emulated on Apple Silicon (~3s to ready).
    platform: linux/amd64
    container_name: journeylab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journeylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journeylab_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-journeylab}
    ports:
      - "127.0.0.1:5700:5432"
    volumes:
      # PG18 changed the recommended mount point: mount /var/lib/postgresql
      # (not .../data) so pg_upgrade --link works without crossing a mount
      # boundary. See docker-library/postgres#1259.
      - journeylab_pgdata:/var/lib/postgresql
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # BUG-009: must be a TCP check, NOT the default Unix-socket one.
      # The official entrypoint runs a TEMPORARY server during first-boot init with
      # listen_addresses='' — socket-only. A socket pg_isready therefore reports
      # "healthy" against a server that is about to be shut down and restarted, so
      # `up --wait` returns early and clients get their connection torn out from
      # under them. Proven: socket=UP/tcp=down at t=1250ms, socket=down/tcp=UP at
      # t=2000ms. -h 127.0.0.1 cannot pass until the real server is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-journeylab} -d ${POSTGRES_DB:-journeylab}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:8-alpine
    container_name: journeylab-cache
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:5701:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  objectstore:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: journeylab-objectstore
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-journeylab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-journeylab_dev_only}
    ports:
      - "127.0.0.1:5702:9000"
      - "127.0.0.1:5703:9001"
    volumes:
      - journeylab_objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  queue:
    # DEC-009 (managed queue vs Kafka) is OPEN. NATS stands in locally; the
    # AsyncAPI contract is transport-independent, so this is substitutable.
    image: nats:2-alpine
    container_name: journeylab-queue
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:5704:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  observability:
    # Jaeger v2: native OTLP receiver + trace UI.
    image: jaegertracing/jaeger:2.0.0
    container_name: journeylab-observability
    ports:
      - "127.0.0.1:5705:4317"   # OTLP gRPC
      - "127.0.0.1:5706:4318"   # OTLP HTTP
      - "127.0.0.1:5707:16686"  # Jaeger UI
    # Healthcheck probes the UI port with wget. The image has no bash (so no
    # /dev/tcp) and no curl, but wget and nc are present.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:16686/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  journeylab_pgdata:
  journeylab_objectdata:
