# JourneyLab workspace definition — STEP-001.01
#
# Package boundaries mirror the portfolio reference shape documented in
# docs/product/03-architecture/TECHNICAL_ARCHITECTURE.md §2.
#
# Module import boundaries are ENFORCED in CI from STEP-001.02 onward:
# a cross-module import that bypasses a package's public interface fails the
# build. Without that enforcement, ADR-003 (modular monolith) degrades into a
# structure that cannot be split later.

packages:
  - "apps/*" # web (Next.js) and api (FastAPI) deployable surfaces
  - "packages/*" # ui, contracts, authz, analytics, observability, security
  - "services/*" # domain, data, retrieval, AI, ML and workflow services
# Packages permitted to run install scripts. pnpm blocks these by default — an
# install script is arbitrary code execution at dependency-install time — so the
# allowlist is explicit and each entry needs a reason (STEP-002.05).
#   esbuild — vitest's bundler; ships a platform binary that must be linked
#   sharp   — Next.js image optimisation; native libvips bindings
#
# BUG-013: the key is `allowBuilds` (a map), NOT pnpm 10's `onlyBuiltDependencies`
# (a list). `pnpm config get onlyBuiltDependencies` still echoes the old list back,
# so the setting LOOKS applied while the installer ignores it. Confirm changes here
# with a clean `rm -rf node_modules && pnpm install --frozen-lockfile`, never with
# `pnpm config get`.
allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.7'
  - '@biomejs/cli-darwin-arm64@2.5.7'
  - '@biomejs/cli-darwin-x64@2.5.7'
  - '@biomejs/cli-linux-arm64-musl@2.5.7'
  - '@biomejs/cli-linux-arm64@2.5.7'
  - '@biomejs/cli-linux-x64-musl@2.5.7'
  - '@biomejs/cli-linux-x64@2.5.7'
  - '@biomejs/cli-win32-arm64@2.5.7'
  - '@biomejs/cli-win32-x64@2.5.7'

