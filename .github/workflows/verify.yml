# JourneyLab verification pipeline — STEP-001.06
#
# Single fast-tier gate. Every check here is a script in tests/guards/ or a
# package script, so it is runnable and debuggable LOCALLY with `pnpm verify`.
# CI must never be the only place a check exists.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # STEP-001.07 (BUG-023): without this, 41 database-backed tests SKIPPED on
    # every push and R7 — the check CLAUDE.md calls non-negotiable — never ran at
    # all. The build was green throughout.
    #
    # The credentials match docker-compose.dev.yml and are development-only. They
    # are in the repository deliberately: a credential that looks secret but is
    # not is worse than one that is obviously local, because it teaches people to
    # treat real secrets casually.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: journeylab
          POSTGRES_PASSWORD: journeylab_dev_only
          POSTGRES_DB: journeylab
        ports:
          - 5700:5432
        # Without a health check the job races the server's first-boot restart and
        # fails intermittently — BUG-009 was exactly that, diagnosed as a schema
        # problem because the symptom looked like missing tables.
        # BUG-025: this MUST be the TCP form. BUG-009 established that the
        # official entrypoint runs a temporary socket-only server during
        # first-boot init, so a default `pg_isready` reports healthy against a
        # server that is about to be shut down and restarted. STEP-001.07 wrote
        # the socket form here and in the mirror despite the warning comment in
        # docker-compose.dev.yml; CI had been passing on timing, not correctness.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U journeylab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Port 5700 matches the dev stack, so the default DSN needs no override and
      # local and CI cannot drift apart.
      JOURNEYLAB_DATABASE_URL: postgresql://journeylab:journeylab_dev_only@127.0.0.1:5700/journeylab
      # A database is expected here, so its absence must FAIL rather than skip.
      JOURNEYLAB_REQUIRE_DB: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # guards diff against the base ref

      # No `version:` here — package.json `packageManager` is the single source of
      # truth. Specifying both makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # Node 24 LTS, single source of truth
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen

      # STEP-003.08: `pnpm verify` ends with a real-browser accessibility run.
      # Chromium and its system libraries are not on the runner by default, and
      # the failure without them is an opaque browser-launch error rather than a
      # missing-dependency message.
      - run: pnpm --filter @journeylab/web exec playwright install --with-deps chromium

      # Migrations, so the database-backed tests have a schema to run against.
      # Applied here rather than inside `pnpm verify` because `verify` is the
      # gate a developer runs against their own already-migrated stack.
      - name: Apply migrations
        run: |
          for m in db/migrations/*.sql; do
            echo "--- $m"
            psql -v ON_ERROR_STOP=1 "$JOURNEYLAB_DATABASE_URL" -q -f "$m"
          done

      # The same checks a developer runs locally, in the same order.
      - run: pnpm verify

      # Traces and the axe report for a failed accessibility run. Without these a
      # CI-only violation has to be reproduced blind.
      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
