openapi: 3.1.0

# JourneyLab API — global conventions.
#
# STEP-004.01 declares ONLY the conventions: the error shape, pagination, the
# headers that govern idempotency and concurrency, and the responses every
# operation reuses. Individual operations arrive in .02-.04 and reference what is
# here rather than restating it.
#
# AUTHORITY (ADR-001)
#   Once this file exists it is authoritative for schemas. `API_CONTRACTS.md`
#   explains contracts and must not duplicate schema definitions. Where the two
#   disagree, this file wins and the document is wrong.
#
# GENERATED FRAGMENTS
#   `schemas/error-codes.json` is generated from `ERROR_MODEL.md` — never edit it,
#   and never inline the enum here. A copy of the code list in this file would be
#   a second source of truth, which is the exact failure ADR-012 exists to prevent.

info:
  title: JourneyLab API
  version: 0.1.0
  summary: Trip digital twin — compare feasible futures before and during travel.
  description: |
    Contract-first. Nothing in this document is implemented yet; every operation
    is `PROPOSED` until its sub-step lands.

    **Deterministic engines own feasibility; the model owns language** (`ADR-002`).
    No endpoint returns a plan the constraint engine has not validated.
  license:
    name: UNLICENSED
    identifier: LicenseRef-proprietary

servers:
  - url: https://api.journeylab.app/v1
    description: Production
  - url: https://localhost:5709/v1
    description: Local development

# The major version is in the path, not a header. `API_CONTRACTS.md` §1: a
# breaking change means a new major version, and a version a caller can forget to
# send is a version they will forget to send.

tags:
  - name: conventions
    description: |
      Shared components. STEP-004.01 defined the vocabulary the operations speak.
  - name: trips
    description: Create and read a trip; replace its structured brief.
  - name: collaboration
    description: Invite collaborators with scoped, expiring permissions.
  - name: booking
    description: |
      Deep-link handoff to providers. **JourneyLab never takes a payment.**
  - name: live
    description: Activation, monitoring and controlled replanning. (Phase 3)
  - name: feedback
    description: Explicit outcome and preference feedback. (Phase 3)
  - name: privacy
    description: |
      Export, correction, consent withdrawal and deletion. The data subject's
      own operations.
  - name: admin
    description: Curation and overrides. Four-eyes where the impact is high.
  - name: platform
    description: Public coverage and job streaming.
  - name: scenarios
    description: |
      Generate, compare and select feasible futures. **Deterministic engines own
      feasibility** (`ADR-002`) — no operation here returns a plan the constraint
      engine has not validated.

paths:
  # ==========================================================================
  # API-001 — create a trip
  # ==========================================================================
  /trips:
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip and its initial planning context.
      description: |
        Authenticated user **or a valid guest session**; creates ownership.

        A guest can plan. That is a product decision, not an oversight: requiring
        an account before a traveller has seen anything useful is the most
        reliable way to lose them. The guest session lasts 7 days (`ADR-013`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
            example:
              origin: { name: 'London', time_zone: 'Europe/London' }
              destination_region: 'gr-cyclades'
              date_range: { start: '2026-09-12', end: '2026-09-19' }
              party: { adults: 2, children: [8], accessibility_needs: [] }
              currency: 'EUR'
              locale: 'en-GB'
      responses:
        '201':
          description: Trip created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '400': { $ref: '#/components/responses/Problem' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: |
            Outside coverage. **A product state, not a failure** — the response
            names the supported regions or date bounds so the traveller can act.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'https://journeylab.app/problems/coverage.unsupported_region'
                title: 'Region not in the destination pack'
                status: 422
                code: 'coverage.unsupported_region'
                correlation_id: 'corr_9f3c2a1b4d5e6f70'
                retryable: false
                detail: 'The Cyclades are not in the Phase 1 destination pack.'
                remediation:
                  kind: 'choose_supported_region'
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # API-002 — read a trip
  # ==========================================================================
  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Read the canonical trip, permissions and current version.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The trip.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-003 — replace the brief
  # ==========================================================================
  /trips/{tripId}/brief:
    put:
      operationId: replaceTripBrief
      tags: [trips]
      summary: Replace the validated structured brief.
      description: |
        The brief is **immutable per version** (`DATA-005`). This creates a new
        version rather than editing one, because an in-place edit would silently
        invalidate every scenario that referenced it — and reproducibility
        (`REQ-CONS-006`) depends on a scenario being able to name the exact brief
        it was solved against.

        **Both `If-Match` and `Idempotency-Key` are required, and that is not
        redundant.** A first version of this operation had only `If-Match`, on the
        reasoning that a conditional PUT is naturally idempotent. It is not
        good enough: if the first attempt succeeds and the response is lost, the
        retry carries a now-stale `If-Match` and gets a 409 — leaving the client
        unable to tell whether its change applied. With an idempotency key the
        replay returns the original result. `If-Match` prevents a lost update;
        the key prevents a lost *answer*.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripBrief' }
      responses:
        '200':
          description: A new brief version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripBrief' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          $ref: '#/components/responses/Infeasible'
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-004 — build an evidence pack
  # ==========================================================================
  /trips/{tripId}/evidence-packs:
    post:
      operationId: buildEvidencePack
      tags: [trips]
      summary: Start evidence assembly.
      description: |
        Returns a job handle **within 500 ms**. Assembly itself takes as long as
        the providers take; what is bounded is the acknowledgement, so the
        interface can show progress instead of a spinner with no end.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Accepted; assembly is running.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobHandle' }
              example:
                job_id: 'job_18'
                status: 'queued'
                events_url: '/v1/jobs/job_18/events'
        '422':
          description: |
            Evidence is insufficient to plan against. **Refused rather than
            partial** — `REQ-EVID-006`: a partial simulation presented as a plan
            is the false confidence this product exists to remove.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-005 — generate scenarios
  # ==========================================================================
  /trips/{tripId}/scenarios:generate:
    post:
      operationId: generateScenarios
      tags: [scenarios]
      summary: Generate a diverse set of feasible scenarios.
      description: |
        `If-Match` carries the **brief version**, not the trip's. Generating
        against a brief that changed while the request was in flight would
        produce scenarios for constraints the traveller has already replaced.

        `random_seed` is part of the request because a scenario run must be
        reproducible from inputs, config, model versions and seed
        (`REQ-CONS-006`).
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateScenariosRequest' }
            example:
              objectives: ['balanced', 'low_cost', 'weather_resilient']
              scenario_count: 3
              evidence_pack_id: 'ep_09'
              random_seed: 4172
      responses:
        '202':
          description: Accepted; generation is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobHandle' }
        '409':
          description: The brief changed since you read it, or the pack is stale.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Infeasible' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
        '504':
          description: |
            The solver exceeded its budget. The last valid state is preserved —
            `REQ-NFR-004`. A timeout must never discard work the traveller can
            still use.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ==========================================================================
  # API-006 / API-007 — list and read scenarios
  # ==========================================================================
  /trips/{tripId}/scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List scenario summaries and comparison metrics.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of scenario summaries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ScenarioSummary' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  /scenarios/{scenarioId}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Read a complete itinerary with its evidence.
      description: |
        **Every volatile value carries source, observed time, effective window
        and confidence** (`REQ-EVID-001`), and every value states whether it is
        `confirmed` or `estimated` (`REQ-EVID-003`). That is enforced by the
        `Evidenced` schema rather than by convention — a bare number cannot be
        returned for a volatile field.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The scenario.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-008 — select the canonical scenario
  # ==========================================================================
  /scenarios/{scenarioId}:select:
    post:
      operationId: selectScenario
      tags: [scenarios]
      summary: Set the canonical plan.
      description: |
        **Owner only.** `AUTHORIZATION_MATRIX` gives `select_canonical_scenario`
        to `trip_owner` and denies it to `trip_editor` — an editor may shape the
        plan and may not decide it.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: This scenario is now canonical.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '409':
          description: Another selection won, or the scenario is no longer current.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The scenario is stale or no longer feasible.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-010 — invite a collaborator (Phase 2)
  # ==========================================================================
  /trips/{tripId}/invitations:
    post:
      operationId: createInvitation
      tags: [collaboration]
      summary: Invite a collaborator with scoped, expiring permissions. (Phase 2)
      description: |
        **Owner only**, and every invitation expires.

        `expires_at` is required with no default. An invitation link that never
        expires is a credential the recipient can forward, lose or keep after
        leaving the trip — and `REQ-SEC-008` requires this to fail closed.

        The token itself is returned **once**, in this response, and is never
        readable again. A collaboration link retrievable from an API is a
        collaboration link an attacker retrieves too.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
            example:
              role: 'trip_editor'
              expires_at: '2026-09-01T00:00:00Z'
      responses:
        '201':
          description: |
            Invitation created. `token` appears here and nowhere else, ever.
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  /trips/{tripId}/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [collaboration]
      summary: Revoke an invitation. (Phase 2)
      description: |
        Revocation is immediate and irreversible. There is no "un-revoke": issuing
        a new invitation is cheap, and a reversible revocation is one an attacker
        who still holds the link can wait out.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Revoked. Idempotent — revoking twice is not an error.
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-011 — booking handoff
  # ==========================================================================
  /trips/{tripId}/booking-handoffs:
    post:
      operationId: createBookingHandoff
      tags: [booking]
      summary: Create a provider deep link and attribution record.
      description: |
        **No schema in this contract accepts or returns a payment credential**, and
        that is asserted by a test that scans the whole document rather than
        trusting review (`TST-BOOK-002`).

        JourneyLab hands off to the provider and records attribution. It never
        sees a card number, and the absence of a field to put one in is what makes
        that true rather than intended — PCI scope you never enter is scope you
        cannot leak.

        When the affiliate is unreachable the response is **not** a dead end: the
        client shows copyable booking details so the traveller can complete the
        booking directly (`REQ-BOOK-004`).
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingHandoffRequest' }
      responses:
        '201':
          description: Deep link and attribution record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingHandoff' }
              example:
                handoff_id: 'bh_04'
                item_id: 'it_11'
                booking_status: 'estimated'
                deep_link: 'https://partner.example/booking?ref=jl_04'
                price: { amount_minor: 12400, currency: 'EUR' }
                copyable_details:
                  provider_name: 'Cyclades Ferries'
                  reference_hint: 'Naxos to Paros, 12 Sept, 09:40'
        '503':
          description: |
            The affiliate is unreachable. The response still carries
            `copyable_details` so the traveller is not blocked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-012 — activate live monitoring (Phase 3)
  # ==========================================================================
  /trips/{tripId}:activate:
    post:
      operationId: activateTrip
      tags: [live]
      summary: Activate live monitoring and produce the offline manifest. (Phase 3)
      description: |
        Owner only. Returns the offline pack manifest and a readiness indicator.

        The manifest is **deliberately extensible**: its exact shape depends on
        device constraints that STEP-017 has not yet established, and freezing a
        guess now would mean a breaking change later. `entries` carries typed
        members; anything else the device needs can arrive additively.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivationResult' }
        '422':
          description: |
            Not ready to activate — for example an unbooked protected item. The
            readiness indicator says what is missing rather than refusing blankly.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-013 — generate repairs, and accept one (Phase 3)
  # ==========================================================================
  /impacts/{impactId}/repairs:generate:
    post:
      operationId: generateRepairs
      tags: [live]
      summary: Generate protected partial-replan alternatives. (Phase 3)
      description: |
        **Generation never mutates the canonical plan.** Acceptance is a separate
        explicit call (`acceptRepair`), and the separation is structural rather
        than a rule someone must remember.

        The reason is that a traveller mid-trip must be able to *look* at what a
        disruption would cost them without committing to it. An operation that
        generated and applied in one step would replan someone's afternoon while
        they were still reading the first option.
      parameters:
        - name: impactId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: |
            Alternatives with their deltas. The canonical plan is unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [repairs]
                properties:
                  repairs:
                    type: array
                    items: { $ref: '#/components/schemas/RepairOption' }
        '422': { $ref: '#/components/responses/Infeasible' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  /impacts/{impactId}/repairs/{repairId}:accept:
    post:
      operationId: acceptRepair
      tags: [live]
      summary: Apply a generated repair to the canonical plan. (Phase 3)
      description: |
        The **only** operation in this contract that changes a live plan in
        response to a disruption. Separate from generation by design.
      parameters:
        - name: impactId
          in: path
          required: true
          schema: { type: string }
        - name: repairId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The repaired scenario.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '409':
          description: |
            The plan moved, or the repair targets a protected item that has not
            been unlocked (`REQ-CONS-011`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-014 — feedback (Phase 3)
  # ==========================================================================
  /trips/{tripId}/feedback:
    post:
      operationId: recordFeedback
      tags: [feedback]
      summary: Record explicit outcome and preference feedback. (Phase 3)
      description: |
        `consent_scope` is **required**. Feedback is training signal, and using it
        without a stated scope is using someone's trip to improve a model they did
        not agree to improve.

        **Absence of feedback never creates a negative label.** There is no field
        for "the user did not respond", because the moment such a field exists
        something will treat silence as dissatisfaction — and a traveller who
        simply got on with their holiday is not an unhappy one.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
            example:
              subject: { kind: 'itinerary_item', id: 'it_11' }
              sentiment: 'positive'
              consent_scope: 'improve_my_trips'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackRecord' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-015 — privacy requests
  # ==========================================================================
  /privacy/requests:
    post:
      operationId: createPrivacyRequest
      tags: [privacy]
      summary: Export, correct, withdraw consent, or delete.
      description: |
        The data subject, or an authorised privacy operator acting for them.

        **Every request is tracked and returns a completion confirmation.** A
        deletion that quietly half-succeeds is worse than one that fails: the
        subject believes their data is gone. `REQ-PRIV-006` requires deletion to
        traverse primary, object, vector, graph, cache, export and token stores,
        and a partial traversal enters a **monitored retry queue** visible to the
        privacy owner rather than being reported as done.

        That is why failure is `202` and not `500` — the request is accepted and
        still in progress, which is the truth.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequest' }
            example:
              kind: 'deletion'
              subject_confirmation: 'I understand this cannot be undone'
      responses:
        '202':
          description: |
            Accepted and tracked. `202` even for a request that completes
            immediately: the subject should learn the outcome from the tracked
            record, not from a status code they have to interpret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestRecord' }
        '422': { $ref: '#/components/responses/Problem' }

  /privacy/requests/{requestId}:
    get:
      operationId: getPrivacyRequest
      tags: [privacy]
      summary: Track a privacy request to completion.
      description: |
        The confirmation half of the contract. A subject who asked for deletion
        must be able to see that it finished, including which stores are still
        outstanding — `REQ-PRIV-007`.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current state of the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestRecord' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-016 — curator evidence override
  # ==========================================================================
  /admin/evidence-overrides:
    post:
      operationId: createEvidenceOverride
      tags: [admin]
      summary: Override a fact, with reason, evidence and an impact preview.
      description: |
        Curator only. **High-impact overrides require four-eyes approval**, which
        the response models explicitly: a high-impact override is created
        `pending_approval` and does not take effect until a *second curator*
        approves it.

        `AUTHORIZATION_MATRIX` §4 names a second curator, not an `ops_admin`, and
        `DEC-010` has not resolved whether an `ops_admin` may stand in. Until it
        does, the contract declares only what the matrix states — encoding a guess
        here would be inventing authorization policy.

        **Known gap:** with a single owner, four-eyes is structurally
        unsatisfiable (`ADR-010`). The contract declares the control correctly;
        satisfying it is an organisational problem, and `STEP-021` cannot ship
        without an answer.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceOverrideRequest' }
      responses:
        '201':
          description: |
            Created. `status` is `active` for a low-impact override and
            `pending_approval` for a high-impact one — the caller does not choose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceOverride' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-017 — public coverage
  # ==========================================================================
  /coverage:
    get:
      operationId: getCoverage
      tags: [platform]
      summary: Supported regions, date bounds, freshness and documented limits.
      # The ONLY unauthenticated operation in this contract. Declared explicitly
      # rather than inherited, so it is visible in a diff.
      security: []
      description: |
        **Public and unauthenticated** — the one operation in this contract that
        is. A traveller must be able to learn whether their destination is
        supported before creating an account, and putting that behind a login
        means asking someone to register to be told "no".

        **It must never expose provider identities or quota details**
        (`REQ-EVID-006`). Which supplier backs a region is commercially
        confidential; how close a provider is to its quota tells an attacker
        exactly when the product degrades. Coverage answers *what is supported*,
        never *how it is supplied*.

        `provider_health` is therefore an aggregate label, not a per-provider
        breakdown.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coverage' }
              example:
                regions:
                  - region_id: 'gr-cyclades'
                    display_name: 'Cyclades, Greece'
                    date_bounds: { start: '2026-04-01', end: '2027-03-31' }
                    freshness: 'current'
                    limitations: ['Ferry timetables are seasonal and change monthly']
                provider_health: 'healthy'
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # API-018 — job event stream and cancellation
  # ==========================================================================
  /jobs/{jobId}/events:
    get:
      operationId: streamJobEvents
      tags: [platform]
      summary: Server-sent progress, warnings and terminal result.
      description: |
        **Heartbeats are required**, and that is the whole point of the
        operation's design. Without them a client cannot distinguish a job that is
        thinking hard from a connection that died — and a traveller watching a
        spinner has no way to tell either. A heartbeat at a stated interval turns
        "is this broken?" into a question the client can answer.

        The stream also carries **warnings**, not only progress and the result.
        A generation that succeeded while three providers were degraded is not the
        same as one that succeeded cleanly, and the difference must reach the
        interface (`REQ-EVID-006`).
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/JobEvent' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  /jobs/{jobId}:
    delete:
      operationId: cancelJob
      tags: [platform]
      summary: Cancel a long-running job.
      description: |
        Cancellation is part of the contract, not an afterthought. A scenario
        generation the traveller no longer wants should stop consuming a solver
        budget, and `REQ-NFR-004` requires the **last valid state to survive** —
        cancelling must never discard work already usable.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: |
            Cancellation requested. `202`, not `204`: a job mid-flight stops when
            it reaches a safe point, and claiming it has already stopped would be
            a lie the client acts on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobHandle' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

  # ==========================================================================
  # API-009 — typed what-if edit (Phase 2)
  # ==========================================================================
  /scenarios/{scenarioId}/edits:
    post:
      operationId: editScenario
      tags: [scenarios]
      summary: Create a new scenario version from a typed edit. (Phase 2)
      description: |
        **Phase 2.** Declared now so the conventions it needs are fixed before
        anything depends on them.

        `impact_preview_token` is the unresolved design question this sub-step
        carries: the token must prove the user saw the consequences of the edit
        before it is applied, and its semantics are designed alongside STEP-014.
        Declared as an opaque required string so the shape cannot change later
        without a version bump.
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioEdit' }
      responses:
        '201':
          description: A new scenario version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '409':
          description: |
            The edit targets a protected or booked item, or the version moved.
            A booked item requires **explicit unlock by the user**
            (`REQ-CONS-011`) — the API will not quietly re-plan around something
            already paid for.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Infeasible' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }

components:
  # --- errors -----------------------------------------------------------------

  schemas:
    ErrorCode:
      $ref: './schemas/error-codes.json'

    Problem:
      type: object
      description: |
        RFC 9457 problem details. Every failure the API reports has this shape and
        is served as `application/problem+json`.

        **What is never here:** another tenant's data, a stack trace, a provider
        identity, or any request content. `ERROR_MODEL.md` §5 states these
        prohibitions and `conventions/problem.py` enforces them — a detail string
        containing a traceback, connection string, credential or email address
        raises rather than being redacted, because a silently-truncated message
        still ships.
      required: [type, title, status, code, correlation_id, retryable]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI, derived from `code`. **Never changes meaning once
            published** — changing it would require changing the code, which is
            already a breaking change under CONTRACT_CHANGE_POLICY.
          examples: ['https://journeylab.app/problems/solver.infeasible']
        title:
          type: string
          description: Short, human-readable summary. Stable per code.
          examples: ['No feasible schedule exists']
        status:
          type: integer
          minimum: 100
          maximum: 599
          examples: [422]
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          description: |
            Safe to display. Optional: an error with nothing specific to add omits
            it rather than repeating the title.
        instance:
          type: string
          description: The request path that produced this problem.
          examples: ['/v1/trips/trp_01/scenarios:generate']
        correlation_id:
          type: string
          description: |
            Always present. `ERROR_MODEL.md` calls it "the single thing support
            needs"; an optional correlation ID is absent from exactly the
            responses anyone wants to investigate.
          examples: ['corr_9f3c2a1b4d5e6f70']
        retryable:
          type: boolean
          description: |
            **Explicit, never inferred from the status.** A 503 from a degraded
            provider is retryable; a 503 because the region is unsupported is not,
            and only the register knows which.
        remediation:
          type: object
          description: |
            A structured, actionable next step where one exists. The design
            principle behind the whole error model: an error must tell the user
            what to do next. "Something went wrong" is not an error model, it is
            an apology.

            **Only `kind` is fixed here; the rest is the specific error's shape.**
            STEP-004.01 declared this with a guessed payload — `conflict_set` and
            `relaxations` as arrays of strings — before any operation needed one.
            STEP-004.02 then needed relaxations that name the constraint they
            relax, because "depart at 15:00 instead" is not actionable unless the
            reader knows which of three constraints it addresses. The guess was
            wrong and the example caught it.

            Composing responses narrow this: see `ConflictSet` and the
            `Infeasible` response.
          required: [kind]
          additionalProperties: true
          properties:
            kind:
              type: string
              examples: ['relax_constraints']

    # --- pagination -----------------------------------------------------------

    Cursor:
      type: string
      maxLength: 2048
      description: |
        Opaque position marker. **Base64, not encryption** — a client can read and
        rewrite it, so it carries a sort key and an identifier and nothing else.
        Never a tenant or identity: those come from the token (`REQ-SEC-001`), and
        the server rejects a cursor containing them.
      examples: ['eyJjcmVhdGVkX2F0IjoiMjAyNi0wOC0xMVQwMDowMDowMFoiLCJpZCI6InRycF8wMSJ9']

    Page:
      type: object
      description: |
        One page of results. **Offset pagination is not supported** — it re-runs
        the query per page, so a row inserted between page 1 and page 2 shifts
        every later row and the caller silently skips records or sees one twice.

        There is deliberately no `total`: counting costs a second query on every
        request, and for a set that changes while the caller pages through it the
        number is stale before it renders.
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Absent or null on the last page.

    # --- money and time -------------------------------------------------------

    # STEP-004.06 moved these to `contracts/jsonschema/`. They were defined inline
    # here first, which was correct while nothing else needed them and became
    # duplication the moment the model-output schemas did. Two copies of a money
    # type diverge silently: one gains a `precision` field, the other does not,
    # and no test compares them.
    Money:
      $ref: './jsonschema/money.json'

    TemporalValidity:
      $ref: './jsonschema/temporal-validity.json'

    Provenance:
      $ref: './jsonschema/provenance.json'

    ConstraintClass:
      $ref: './jsonschema/constraint-class.json'

    # --- evidence ---------------------------------------------------------------

    Evidenced:
      type: object
      description: |
        A volatile value together with the evidence for it.

        **`REQ-EVID-001`: every volatile fact shows source, observed time,
        effective time and confidence.** This schema is how that stops being a
        promise — a bare number cannot be returned for a volatile field, because
        the field's type is this object and every provenance member is required.

        **`REQ-EVID-003`: an estimate is never rendered as confirmed.** `status`
        is required and has no default. A caller that ignores it renders an
        estimate as fact, which is the specific failure this product exists to
        remove, so it is not optional and not inferable.
      required: [value, status, provenance, validity]
      additionalProperties: false
      properties:
        value: {}
        status:
          type: string
          enum: [confirmed, estimated]
          description: |
            `confirmed` means a provider stated it. `estimated` means we derived
            it. The interface must never present the second as the first.
        provenance:
          # Composed, not restated. STEP-004.06 — source, confidence and access
          # label are one shared concept used by evidence, events and model output.
          $ref: './jsonschema/provenance.json'
        validity:
          # The three time axes. Restating observed_at and the effective window
          # here is how one of the three quietly goes missing.
          $ref: './jsonschema/temporal-validity.json'
        conflicts:
          type: array
          description: |
            Other sources that disagree. **Retained, never averaged**
            (`REQ-EVID-002`) — the mean of two conflicting departure times is a
            time no ferry leaves.
          items:
            # SYMMETRIC WITH THE PARENT, AND THAT IS THE POINT (BUG-020).
            #   This was `source: { type: object }` — an object with nothing
            #   declared in it, which generated as `Record<string, never>`: a
            #   conflicting source that cannot state who it is. Retaining a
            #   disagreement nobody can attribute is not `REQ-EVID-002`.
            #
            #   A conflicting claim needs everything the primary claim needs.
            #   `access_label` especially: a licensed source may be
            #   `internal_only`, so the interface has to know it may plan with
            #   the conflicting value and may not display it.
            #
            #   `validity` is required for a reason that is easy to miss —
            #   without it, two sources observed hours apart look like a
            #   disagreement when they are actually one value that changed.
            #   Conflict and staleness are different problems with different
            #   remedies, and only the time axes tell them apart.
            type: object
            required: [value, provenance, validity]
            additionalProperties: false
            properties:
              value: {}
              provenance:
                $ref: './jsonschema/provenance.json'
              validity:
                $ref: './jsonschema/temporal-validity.json'

    ConflictSet:
      type: object
      description: |
        Why no feasible plan exists, and what would restore one.

        **`REQ-CONS-005`: infeasibility returns a minimal conflict set, never a
        plausible invalid plan.** Minimal matters: "these seventeen constraints
        conflict" is not actionable, and a traveller cannot tell which one to
        relax. The set is the smallest subset that is still contradictory.
      required: [conflicts]
      # NOT `additionalProperties: false`, and the reason is a JSON Schema trap
      # rather than a loosening.
      #
      # `ConflictSet` is composed with `allOf` into the infeasible response, which
      # adds `kind: relax_constraints`. Each `allOf` branch validates the whole
      # instance independently, so a closed branch rejects a property another
      # branch declares — the example failed with `additionalProperties` against a
      # field the same schema requires two lines later.
      #
      # A schema built for composition cannot be closed. `Party` and `Money` are
      # closed precisely because they are leaves.
      properties:
        kind:
          type: string
          description: |
            Set by the composing response. Declared here so the composition is
            legible from this schema alone.
        conflicts:
          type: array
          minItems: 2
          description: |
            At least two. A single constraint cannot conflict with itself — a
            one-item set means the solver failed to explain, not that it found a
            minimal cause.
          items:
            type: object
            required: [constraint_id, statement]
            properties:
              constraint_id: { type: string }
              statement:
                type: string
                description: The constraint in the traveller's own words.
        relaxations:
          type: array
          description: |
            Concrete alternatives, each of which alone restores feasibility.
            Optional because the solver cannot always find one, and inventing a
            suggestion it has not verified would be worse than offering none.
          items:
            type: object
            required: [constraint_id, suggestion]
            properties:
              constraint_id: { type: string }
              suggestion: { type: string }

    # --- trips --------------------------------------------------------------------

    Place:
      type: object
      required: [name, time_zone]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        time_zone:
          type: string
          description: IANA identifier. Required — see `ZonedTimestamp`.
        place_id: { type: string }

    LocalDateRange:
      type: object
      description: |
        **Local dates, not timestamps** (`DATA-004`). A trip starting "12
        September" starts on the 12th wherever the traveller is; converting it to
        an instant at creation would shift it for anyone in another zone.
      required: [start, end]
      additionalProperties: false
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }

    Party:
      type: object
      required: [adults]
      additionalProperties: false
      properties:
        adults: { type: integer, minimum: 1, maximum: 20 }
        children:
          type: array
          description: Ages at the time of travel, which is what affects eligibility.
          items: { type: integer, minimum: 0, maximum: 17 }
          maxItems: 20
        accessibility_needs:
          type: array
          description: |
            **Declared, never inferred** (`REQ-PRIV-003`). Nothing in this product
            derives an accessibility need from behaviour; it appears here only
            because the traveller stated it.
          items: { type: string }

    CreateTripRequest:
      type: object
      required: [destination_region, date_range, party, currency, locale]
      additionalProperties: false
      properties:
        origin: { $ref: '#/components/schemas/Place' }
        destination_region: { type: string }
        date_range: { $ref: '#/components/schemas/LocalDateRange' }
        party: { $ref: '#/components/schemas/Party' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: string }

    Trip:
      type: object
      required: [trip_id, destination_region, date_range, party, currency, locale, version]
      properties:
        trip_id: { type: string }
        origin: { $ref: '#/components/schemas/Place' }
        destination_region: { type: string }
        date_range: { $ref: '#/components/schemas/LocalDateRange' }
        party: { $ref: '#/components/schemas/Party' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        locale: { type: string }
        version: { type: integer, minimum: 1 }
        canonical_scenario_id:
          oneOf:
            - { type: string }
            - { type: 'null' }
          description: |
            Exactly zero or one (`DATA-004`). A trip with two canonical plans is
            a trip nobody has decided.
        permissions:
          type: array
          description: |
            What the CALLER may do. Presentation only — the server enforces
            regardless, and a client that hides a button has hidden a button, not
            prevented an action.
          items: { type: string }

    Constraint:
      type: object
      required: [constraint_id, statement, priority]
      properties:
        constraint_id: { type: string }
        statement: { type: string }
        unit:
          type: string
          description: |
            Required by `DATA-005` for every entry. "Under two hours" and "under
            120" are the same constraint only if the unit is stated.
        priority: { type: integer, minimum: 1 }
        provenance:
          type: string
          description: Required on every `inferred` entry (`DATA-005`).

    TripBrief:
      type: object
      description: |
        **Four separate collections, never a single typed-union list**
        (`DATA-005`). A union invites code that forgets to branch; four arrays
        make "did you handle unresolved constraints?" a question the type system
        asks.
      required: [version, hard, soft, inferred, unresolved]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        hard:
          type: array
          items: { $ref: '#/components/schemas/Constraint' }
        soft:
          type: array
          items: { $ref: '#/components/schemas/Constraint' }
        inferred:
          type: array
          description: Every entry carries a provenance reference.
          items: { $ref: '#/components/schemas/Constraint' }
        unresolved:
          type: array
          description: |
            Ambiguities that block solving. A brief with a blocking unresolved
            entry is not solvable, and saying so is better than guessing
            (`REQ-CONS-002`).
          items: { $ref: '#/components/schemas/Constraint' }
        confirmed_at: { type: string, format: date-time }

    # --- scenarios ------------------------------------------------------------------

    JobHandle:
      type: object
      description: |
        Returned within 500 ms by any operation that cannot complete in a request.
        `events_url` is a `text/event-stream` endpoint, so progress is pushed
        rather than polled.
      required: [job_id, status, events_url]
      additionalProperties: false
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        events_url: { type: string }

    GenerateScenariosRequest:
      type: object
      required: [objectives, scenario_count, evidence_pack_id]
      additionalProperties: false
      properties:
        objectives:
          type: array
          minItems: 1
          items: { type: string }
        scenario_count: { type: integer, minimum: 1, maximum: 10 }
        evidence_pack_id:
          type: string
          description: |
            The immutable pack this run is solved against (`DATA-008`,
            `ADR-004`). Naming it is what makes the run reproducible.
        random_seed:
          type: integer
          description: |
            Supplied by the caller so a run can be repeated exactly
            (`REQ-CONS-006`). Omitted means the server chooses and returns it.

    ScenarioSummary:
      type: object
      required: [scenario_id, label, feasible, metrics]
      properties:
        scenario_id: { type: string }
        label: { type: string }
        feasible:
          type: boolean
          description: |
            Always true for a returned scenario. Present so the field exists in
            the contract before STEP-019 introduces a scenario that becomes
            infeasible after a condition change.
        metrics:
          type: object
          description: Comparison metrics. Money is always `Money`, never a number.
          additionalProperties: true
        total_cost: { $ref: '#/components/schemas/Money' }

    ItineraryItem:
      type: object
      required: [item_id, kind, starts_at, ends_at]
      properties:
        item_id: { type: string }
        kind: { type: string }
        title: { type: string }
        starts_at: { $ref: '#/components/schemas/ZonedTimestamp' }
        ends_at: { $ref: '#/components/schemas/ZonedTimestamp' }
        cost: { $ref: '#/components/schemas/Money' }
        opening_hours: { $ref: '#/components/schemas/Evidenced' }
        travel_minutes: { $ref: '#/components/schemas/Evidenced' }
        protected:
          type: boolean
          description: |
            Booked or pinned. An edit touching a protected item is refused until
            the user explicitly unlocks it (`REQ-CONS-011`).

    Scenario:
      type: object
      required: [scenario_id, trip_id, version, brief_version, evidence_pack_id, items]
      properties:
        scenario_id: { type: string }
        trip_id: { type: string }
        version: { type: integer, minimum: 1 }
        brief_version:
          type: integer
          description: |
            The exact brief this was solved against. Reproducibility needs it
            (`REQ-CONS-006`), and a scenario whose brief has moved on is stale
            rather than wrong.
        evidence_pack_id: { type: string }
        random_seed: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItineraryItem' }
        score_components:
          type: object
          additionalProperties: true

    ScenarioEdit:
      type: object
      required: [edit_type, impact_preview_token]
      additionalProperties: false
      properties:
        edit_type: { type: string }
        target_item_id: { type: string }
        payload:
          type: object
          additionalProperties: true
        impact_preview_token:
          type: string
          description: |
            Proof that the caller was shown the consequences of this edit before
            applying it. Semantics are designed with STEP-014; declared required
            and opaque now so the shape cannot change without a version bump.

    # --- collaboration ---------------------------------------------------------

    CreateInvitationRequest:
      type: object
      required: [role, expires_at]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [trip_editor, trip_viewer]
          description: |
            **Not `trip_owner`.** Ownership is not something an owner can hand out
            through an invitation link; transferring it is a separate, deliberate
            act. An invitation that could confer ownership is an invitation that
            can lose you your trip.
        expires_at:
          type: string
          format: date-time
          description: |
            **Required, no default.** A link that never expires is a credential
            the recipient can forward, lose, or keep after leaving the trip.
        email:
          type: string
          description: |
            Optional. When present the invitation is delivered rather than
            returned as a bare link. Not required, because a traveller sharing a
            plan with a friend should not have to surrender the friend's address.

    InvitationCreated:
      type: object
      required: [invitation_id, role, expires_at, token]
      additionalProperties: false
      properties:
        invitation_id: { type: string }
        role: { type: string }
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: |
            **Returned once, here, and never readable again.** A collaboration
            link retrievable from an API is a collaboration link an attacker
            retrieves too. Losing it means revoking and reissuing, which is cheap.

    # --- booking ------------------------------------------------------------------

    BookingStatus:
      type: string
      enum: [estimated, confirmed, cancelled]
      description: |
        **Distinct states, not a boolean.** `REQ-EVID-003` forbids rendering an
        estimate as confirmed, and a boolean `is_confirmed` makes the two the same
        field with different values — which is how a default of `false` becomes a
        default of `true` in someone's mapper. Three named states also leave room
        for `cancelled`, which a boolean cannot express at all.

    CreateBookingHandoffRequest:
      type: object
      required: [item_id]
      additionalProperties: false
      properties:
        item_id: { type: string }
        preferred_provider_id: { type: string }

    CopyableBookingDetails:
      type: object
      description: |
        What the traveller needs to complete the booking **themselves** when the
        affiliate is unreachable (`REQ-BOOK-004`). A dead deep link must never be
        a dead end.
      required: [provider_name]
      additionalProperties: false
      properties:
        provider_name:
          type: string
          description: |
            Display name only. The provider's internal identity is commercially
            confidential and is never returned (`ERROR_MODEL.md` §5).
        reference_hint: { type: string }
        booking_url: { type: string }

    BookingHandoff:
      type: object
      description: |
        **There is no payment field here, and there is none anywhere in this
        contract.** JourneyLab deep-links to the provider; it never takes a
        payment. PCI scope you never enter is scope you cannot leak, and the
        absence of a field is what makes that structural rather than intended.
      required: [handoff_id, item_id, booking_status]
      additionalProperties: false
      properties:
        handoff_id: { type: string }
        item_id: { type: string }
        booking_status: { $ref: '#/components/schemas/BookingStatus' }
        deep_link: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        copyable_details: { $ref: '#/components/schemas/CopyableBookingDetails' }
        booking_reference:
          type: string
          description: |
            The provider's own reference, once they confirm. An opaque string we
            store and display — never a credential, and never anything that could
            be used to act on the traveller's behalf.

    # --- live -----------------------------------------------------------------------

    OfflineManifestEntry:
      type: object
      required: [kind, uri]
      properties:
        kind: { type: string }
        uri: { type: string }
        bytes: { type: integer, minimum: 0 }

    ActivationResult:
      type: object
      description: |
        The offline manifest is **extensible on purpose**. Its exact shape depends
        on device constraints STEP-017 has not established, and freezing a guess
        now would make the correction a breaking change. Typed entries plus room
        to grow.
      required: [activated, readiness, manifest]
      properties:
        activated: { type: boolean }
        readiness:
          type: object
          description: |
            What is and is not ready, itemised. A blank refusal to activate tells
            a traveller at an airport nothing they can act on.
          required: [ready]
          properties:
            ready: { type: boolean }
            blocking:
              type: array
              items: { type: string }
        manifest:
          type: object
          required: [entries]
          properties:
            entries:
              type: array
              items: { $ref: '#/components/schemas/OfflineManifestEntry' }

    RepairOption:
      type: object
      description: |
        One alternative, with what it costs. **Generating this changes nothing** —
        acceptance is a separate call.
      required: [repair_id, preserved_plan_percent, deltas]
      properties:
        repair_id: { type: string }
        summary: { type: string }
        preserved_plan_percent:
          type: number
          minimum: 0
          maximum: 100
          description: |
            How much of the existing plan survives. The number a traveller
            actually cares about mid-trip: "you keep 80% of your afternoon" is a
            decision they can make in thirty seconds.
        deltas:
          type: object
          required: [cost, minutes]
          properties:
            cost: { $ref: '#/components/schemas/Money' }
            minutes: { type: integer }
            effort:
              type: string
              enum: [low, medium, high]
        touches_protected_items:
          type: boolean
          description: |
            True when applying this needs an explicit unlock first
            (`REQ-CONS-011`). Surfaced on the option so the traveller learns it
            before choosing, not after.

    # --- feedback ---------------------------------------------------------------------

    FeedbackRequest:
      type: object
      description: |
        **No field records the absence of feedback.** The moment one exists,
        something treats silence as dissatisfaction — and a traveller who simply
        got on with their holiday is not an unhappy one.
      required: [subject, sentiment, consent_scope]
      additionalProperties: false
      properties:
        subject:
          type: object
          required: [kind, id]
          additionalProperties: false
          properties:
            kind: { type: string }
            id: { type: string }
        sentiment:
          type: string
          enum: [positive, negative, mixed]
          description: |
            Explicit only. Every value here was chosen by a person; nothing infers
            one from behaviour (`REQ-PRIV-003`).
        comment: { type: string, maxLength: 2000 }
        consent_scope:
          type: string
          enum: [this_trip_only, improve_my_trips, improve_the_product]
          description: |
            **Required.** Feedback is training signal, and using it without a
            stated scope is using someone's trip to improve a model they did not
            agree to improve. The narrowest option is the first one.

    FeedbackRecord:
      type: object
      required: [feedback_id, recorded_at, consent_scope]
      properties:
        feedback_id: { type: string }
        recorded_at: { type: string, format: date-time }
        consent_scope: { type: string }

    # --- privacy ------------------------------------------------------------------

    PrivacyRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [export, correction, consent_withdrawal, deletion]
        subject_confirmation:
          type: string
          description: |
            Required by the handler when `kind` is `deletion`. Declared optional
            here because the contract cannot express that conditional without
            a conditional that generated clients render badly; the handler
            enforces it and `TST-PRIV-005` will assert it. Stated rather than left
            as an apparent hole.
        correction:
          type: object
          description: |
            Field-level corrections. Used when `kind` is `correction`.
          additionalProperties: true

    PrivacyStoreStatus:
      type: object
      description: |
        Per-store progress. `REQ-PRIV-006` requires deletion to traverse primary,
        object, vector, graph, cache, export and token stores — so the record
        names them individually. **A subject who asked for deletion must be able
        to see which stores are still outstanding**, not a single boolean that is
        true when the easy ones finished.
      required: [store, state]
      properties:
        store:
          type: string
          enum: [primary, object, vector, graph, cache, export, token]
        state:
          type: string
          enum: [pending, complete, retrying, failed]

    PrivacyRequestRecord:
      type: object
      required: [request_id, kind, state, stores, created_at]
      properties:
        request_id: { type: string }
        kind: { type: string }
        state:
          type: string
          enum: [accepted, in_progress, complete, partially_failed]
          description: |
            `partially_failed` exists deliberately. A deletion that finished six
            of seven stores is not complete, and calling it complete is the exact
            failure `REQ-PRIV-007` guards against.
        stores:
          type: array
          items: { $ref: '#/components/schemas/PrivacyStoreStatus' }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        export_url:
          type: string
          description: |
            Present for a completed export. Expiring, single-use; a permanent link
            to someone's entire trip history is a credential.

    # --- admin ------------------------------------------------------------------------

    EvidenceOverrideRequest:
      type: object
      required: [fact_id, value, reason, effective_from, evidence]
      additionalProperties: false
      properties:
        fact_id: { type: string }
        value: {}
        reason:
          type: string
          minLength: 10
          description: |
            **Required, with a minimum length.** An override with no stated reason
            is indistinguishable from a mistake six months later, and "fix" is not
            a reason.
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        evidence:
          type: array
          minItems: 1
          description: |
            What the curator is relying on. A fact override with no supporting
            evidence is an opinion overwriting a source.
          items:
            type: object
            required: [description]
            properties:
              description: { type: string }
              url: { type: string }

    EvidenceOverride:
      type: object
      required: [override_id, status, impact_preview]
      properties:
        override_id: { type: string }
        status:
          type: string
          enum: [active, pending_approval, rejected]
          description: |
            **Set by the server, not requested.** A high-impact override is
            created `pending_approval` and takes effect only when a second curator
            approves it — a caller that could choose `active` would be a caller
            that could skip four-eyes.
        impact_preview:
          type: object
          description: |
            Which scenarios this would change, before it takes effect. An override
            whose consequences are invisible until applied is one nobody can
            review.
          required: [affected_scenario_count]
          properties:
            affected_scenario_count: { type: integer, minimum: 0 }
            affected_trip_count: { type: integer, minimum: 0 }
        approver_required:
          type: boolean
          description: True when four-eyes applies.

    # --- platform -----------------------------------------------------------------------

    CoverageRegion:
      type: object
      required: [region_id, display_name, date_bounds, freshness]
      additionalProperties: false
      properties:
        region_id: { type: string }
        display_name: { type: string }
        date_bounds: { $ref: '#/components/schemas/LocalDateRange' }
        freshness:
          type: string
          enum: [current, degraded, stale]
        limitations:
          type: array
          description: |
            Documented honestly. `REQ-TRIP-002` wants an honest scope statement,
            and "ferry timetables are seasonal and change monthly" is worth more
            to a traveller than a green tick.
          items: { type: string }

    Coverage:
      type: object
      description: |
        **Public. Contains no provider identity and no quota detail**
        (`REQ-EVID-006`).

        Which supplier backs a region is commercially confidential, and how close
        a provider is to its quota tells an attacker precisely when the product
        degrades. This answers *what is supported*, never *how it is supplied* —
        which is why `provider_health` is one aggregate label rather than a
        per-provider breakdown, and why the schema is **closed**.
      required: [regions, provider_health]
      additionalProperties: false
      properties:
        regions:
          type: array
          items: { $ref: '#/components/schemas/CoverageRegion' }
        provider_health:
          type: string
          enum: [healthy, degraded, unavailable]
          description: |
            An aggregate. Never a list, never named, never a count — each of those
            leaks the shape of the supply chain.

    JobEvent:
      type: object
      description: |
        One server-sent event. `heartbeat` is not filler: without it a client
        cannot tell a job that is thinking from a connection that died.
      required: [event, job_id]
      properties:
        event:
          type: string
          enum: [heartbeat, progress, warning, result, error]
        job_id: { type: string }
        sequence:
          type: integer
          description: |
            Monotonic, so a client that reconnects can tell whether it missed
            anything rather than assuming it did not.
        progress_percent: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        problem:
          $ref: '#/components/schemas/Problem'

    ZonedTimestamp:
      type: object
      description: |
        An instant plus the IANA zone it should be read in. Both, because a trip
        in Tokyo is read in Tokyo time by a traveller sitting in London, and
        because a calendar day is not always 24 hours long — DST correctness is a
        feasibility concern, not a formatting one.
      required: [instant, time_zone]
      additionalProperties: false
      properties:
        instant:
          type: string
          format: date-time
          description: RFC 3339, UTC.
          examples: ['2026-03-29T01:30:00Z']
        time_zone:
          type: string
          description: IANA identifier.
          examples: ['Europe/London']

  # --- parameters ---------------------------------------------------------------

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **Required on every state-changing command.** Optional idempotency is
        idempotency nobody uses until after the duplicate-charge incident.
        Generate one per user intent and reuse it for every retry of that intent;
        a replay returns the original result, and reuse with a different body is
        a client defect and returns 409.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:\-]{8,255}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        **Required, not optional.** RFC 9110 permits a server to require it, and
        here the point is that an editor states which version they are replacing.
        Treating absence as "no opinion" loses an update on the first request
        that forgets the header.
      schema: { type: string }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Echoed back. Minted when absent or unusable.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:\-]{8,128}$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Cursor' }
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Clamped to 1-100, **not rejected** when out of range: `limit` is a hint
        about response size, not a semantic input, and failing a request because
        someone asked for 500 teaches clients to guess the cap instead of reading
        it.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  # --- headers ------------------------------------------------------------------

  headers:
    ETag:
      description: |
        Strong entity tag. Strong rather than weak (`W/`) because `If-Match`
        requires strong comparison — a weak tag makes the precondition succeed for
        representations that are equivalent but not identical, which is exactly
        the case a lost-update check must reject.
      required: true
      schema: { type: string }
    CorrelationId:
      description: Echoed from the request, or minted when absent or unusable.
      required: true
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait. Present on every 429 and 503.
      schema: { type: integer, minimum: 0 }
    Deprecation:
      description: Set when the operation is deprecated; paired with `Sunset`.
      schema: { type: string }
    Sunset:
      description: RFC 8594 date after which the operation stops responding.
      schema: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC/OAuth 2.1, short-lived. **Tenant context is derived from the token,
        never from a client-supplied header or body field** (`REQ-SEC-001`).

  # --- reusable responses ---------------------------------------------------------

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

    NotFoundOrForbidden:
      description: |
        **The resource does not exist, or you may not see it — indistinguishably.**

        Both cases return the same status, the same body and the same headers. If
        they differed the API would be an existence oracle: an attacker enumerates
        identifiers and learns which ones are real in another tenant. The resource
        is protected; its existence is not (`REQ-SEC-004`).

        The distinction survives only in the server-side audit record, where it is
        needed for investigation and cannot be observed by the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'https://journeylab.app/problems/authz.forbidden'
            title: 'Not permitted'
            status: 404
            code: 'authz.forbidden'
            correlation_id: 'corr_9f3c2a1b4d5e6f70'
            retryable: false
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

    Conflict:
      description: |
        Version conflict, or an `Idempotency-Key` reused with a different body.
        The two are distinct codes — `concurrency.version_mismatch` and the
        idempotency case — because the client action differs: refetch and re-apply
        versus fix a defect.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

    Infeasible:
      description: |
        **No feasible plan exists — a product state, not a failure.**

        `REQ-CONS-005`: the response carries a **minimal conflict set**, never a
        plausible invalid plan. `ERROR_MODEL.md` §4 is explicit that this must not
        be rendered as an error toast: the correct presentation is a first-class
        screen saying "these three constraints conflict — relaxing any one
        restores feasibility".
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [remediation]
                properties:
                  remediation:
                    allOf:
                      - $ref: '#/components/schemas/ConflictSet'
                      - type: object
                        required: [kind]
                        properties:
                          kind:
                            type: string
                            const: relax_constraints
          example:
            type: 'https://journeylab.app/problems/solver.infeasible'
            title: 'No feasible schedule exists'
            status: 422
            code: 'solver.infeasible'
            correlation_id: 'corr_9f3c2a1b4d5e6f70'
            retryable: false
            remediation:
              kind: 'relax_constraints'
              conflicts:
                - constraint_id: 'c_arrive_sifnos'
                  statement: 'Arrive Sifnos before 18:00 on Wednesday'
                - constraint_id: 'c_depart_antiparos'
                  statement: 'Depart Antiparos after 16:30 on Wednesday'
              relaxations:
                - constraint_id: 'c_arrive_sifnos'
                  suggestion: 'Arrive by 19:30 instead'
                - constraint_id: 'c_depart_antiparos'
                  suggestion: 'Depart at 15:00 instead'
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

    RateLimited:
      description: |
        Quota exceeded. Per-operation limits are declared with each operation in
        `.02`-`.04`; the numbers need capacity projections that do not exist yet
        (`ASM-002`), so this sub-step declares the mechanism and defers the values
        rather than inventing them.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }

security:
  - bearerAuth: []
